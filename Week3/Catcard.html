<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cat Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
        background-color: lightblue;
        font-family: Arial, sans-serif;
    }
    .card {
        box-sizing: border-box;
        width: 500px;
        height: 750px;
        background-color: white;
        padding: 36px;
        border-radius: 12px;
        box-shadow: 5px 10px #888888;
    }
    .card img {
        width: 100%;
        height: 300px;
        object-fit: cover;
        margin-bottom: 12px;
    }
    .card h1 {
        font-family: 'Roboto', sans-serif;
        color: darkblue;
        font-size: 32px;
    }
    .card p {
        font-size: 16px;
    }
    .button {
        display: inline-block;
        background-color: darkblue;
        color: white;
        padding: 10px 15px;
        text-decoration: none;
    }
    .button:hover {
        background-color: royalblue;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=800&amp;q=80" alt="An orange cat looking at the camera">
    <h1>Just a Cat</h1>
    <p>Cats spend a lot of time sleeping, but they also like to play and explore. I picked this cat because it looks like it is waiting for a snack.</p>
    <a class="button" href="https://en.wikipedia.org/wiki/Cat">Learn about cats</a>
  </div>
</body>
</html>
